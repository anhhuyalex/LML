name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  pull_request:
    branches:
      - main
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests
  actions: write          # Write access to GitHub Actions

env:
  REFEREE_REPO: LeanMachineLearning/exposition
  # Pin the revision whose executable target and CLI are used below.
  REFEREE_REV: 6b1da0c44eaa30973eb5a8f3defb0181f774eb7a

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true # saves approximately 12 GB
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          lint: true
          mk_all-check: true

      - name: Build Verso Documentation
        run: |
          ./scripts/build_docs.sh

      - name: Clone Referee
        if: github.event_name == 'push'
        run: |
          git init /tmp/referee
          git -C /tmp/referee remote add origin "https://github.com/$REFEREE_REPO"
          git -C /tmp/referee fetch --depth 1 origin "$REFEREE_REV"
          git -C /tmp/referee checkout --detach FETCH_HEAD

      - name: Build Referee binary
        if: github.event_name == 'push'
        run: |
          PROJECT_TOOLCHAIN="$(cat "$GITHUB_WORKSPACE/lean-toolchain")"
          cd /tmp/referee
          ELAN_TOOLCHAIN="$PROJECT_TOOLCHAIN" lake build referee
          test -x .lake/build/bin/referee
          echo "REFEREE_BIN=/tmp/referee/.lake/build/bin/referee" >> "$GITHUB_ENV"

      - name: Build exposition documentation
        if: github.event_name == 'push'
        run: |
          lake env "$REFEREE_BIN" all \
            --root LeanMachineLearning \
            --repo-url https://github.com/anhhuyalex/LML \
            --site-url https://anhhuyalex.github.io/LML/exposition \
            --output ./exposition \
            --exclude-lib LMLTutorial
          mkdir -p home_page/exposition
          cp -r exposition/html-multi/* home_page/exposition

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@7b5b9a1822650bd45aaeb4182d94bceba2030f89 # 2026-04-14
        with:
          homepage: home_page
          blueprint: true
          build-page: false
          deploy: false

      - name: "Upload website (API documentation, blueprint and any home page)"
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
