name: Build

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  pull_request:
    branches:
      - main
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write         # Push the provenance ledger to its own branch (the referee action does)
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests
  actions: read           # Read the previous run's artifact, for the referee revision diff

jobs:
  check_website_stats:
    runs-on: ubuntu-latest
    name: Check Stats from a clean checkout
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run before the expensive Lean build. A fresh checkout catches missing or ignored
      # Python modules and frontend assets that can accidentally pass local tests.
      - name: Install the Stats dataset reader
        run: python3 -m pip install -r scripts/website_stats/requirements.txt
      - name: Test Stats calculations, site assembly and browser interactions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/check_stats.py

  build_project:
    needs: check_website_stats
    # Upstream pins this runner to avoid documentation builds exhausting memory.
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true # saves approximately 12 GB
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing for provenance, not just a convenience: the ledger's edit half is
          # `git blame`, and at the default `fetch-depth: 1` blame attributes the entire library to
          # the single fetched commit. The action would unshallow the checkout itself, but fetching
          # it here saves that second round trip.
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build: true
          lint: true
          mk_all-check: true

      # The maintained Referee reader follows the project's Lean toolchain. Stats consumes
      # its versioned dataset protocol; a Lean bump does not change the statistics adapter.
      - name: Build the referee site
        id: referee
        if: github.event_name == 'push'
        uses: LeanTrustBuilders/referee-site@3b745e5b418ceff84f30f2f9a64af0c4938effa7 # v0.12.0
        with:
          root: LeanMachineLearning
          trust: mathlib
          extract-args: --upstream-closure term

      # Unconditional, unlike the referee step: on a pull request this is the check that the
      # tutorial still builds. Placed after the referee step, which folds the provenance ledger, so
      # that `home_page/` and `LMLTutorial/_out/` do not exist yet when the ledger records whether
      # the tree was clean.
      - name: Build Verso Documentation
        run: |
          ./scripts/build_docs.sh

      # `blueprint: true` runs `leanblueprint pdf`, `leanblueprint web` and then
      # `lake exe checkdecls blueprint/lean_decls`. That last step imports the root module of every
      # `lean_lib`, which is why `LMLTutorial` is built by `scripts/build_docs.sh` above, and it needs
      # the `checkdecls` entry in `lakefile.toml`.
      - name: Build API documentation and blueprint
        uses: leanprover-community/docgen-action@7b5b9a1822650bd45aaeb4182d94bceba2030f89 # 2026-04-14
        with:
          homepage: home_page
          blueprint: true
          build-page: false
          deploy: false

      # Force the project's own API pages to be rendered on every push.
      #
      # The docgen action restores a `Docs-<hash of lake-manifest.json>` cache of Mathlib's rendered
      # pages and doc-gen4's bookkeeping. That key only changes with the manifest, and a cache that
      # was hit is never saved again, so the restored state is whatever the first run after the last
      # manifest change left behind. It includes the marker file
      # `doc-data/LeanMachineLearning--library.docs_built` (with its `.trace`), which is what lets
      # Lake report `Replayed LeanMachineLearning:docs` and skip the HTML generation. The per-module
      # `docInfo` jobs still rebuild into the database, but no page for this project is ever written,
      # so every `docs/LeanMachineLearning/...` URL returns 404 and the search index goes stale.
      #
      # Deleting the marker makes Lake run the generation step again for this library only; Mathlib's
      # pages stay cached. The action has already built `docbuild/` by now, so this is a quick re-run
      # against warm build outputs. Push only, like the action's own docs step.
      - name: Regenerate the project's API documentation pages
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          marker=docbuild/.lake/build/doc-data/LeanMachineLearning--library.docs_built
          ls -l "$marker"* 2>/dev/null || echo "No docs_built marker found; the pages should already have been generated."
          rm -f "$marker" "$marker.trace" "$marker.hash"
          cd docbuild
          ~/.elan/bin/lake build LeanMachineLearning:docs
          cd ..
          test -f docbuild/.lake/build/doc/LeanMachineLearning/Optimization/NTK/Shallow/DatasetNTK.html || { echo "::error::LeanMachineLearning API pages were not generated"; exit 1; }
          cp -r docbuild/.lake/build/doc/. home_page/docs/

      # After the docs step, which writes into the same folder alongside `tutorial/` from
      # `build_docs.sh`. Those steps only ever add, so the order is not load-bearing — but copying
      # last keeps the referee output out of reach of anything else that writes there.
      - name: Add the referee site to the home page
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p home_page/exposition
          cp -r "${{ steps.referee.outputs.site }}/." home_page/exposition/

      - name: Add exposition statistics
        if: github.event_name == 'push'
        env:
          REFEREE_DATA: ${{ steps.referee.outputs.dataset }}
        run: |
          python3 scripts/build_stats.py --data "$REFEREE_DATA" \
            --repository "https://github.com/$GITHUB_REPOSITORY"

      - name: Set up .NET for leanviz
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # Validate on PRs and manual runs too; only the existing push deployment publishes it.
      - name: Build and validate leanviz
        run: bash scripts/build_leanviz.sh

      # Small examples run on every event. Pushes also check the assembled full Stats page.
      - name: Validate exposition statistics
        env:
          BUILD_FULL_STATS: ${{ github.event_name == 'push' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [[ "$BUILD_FULL_STATS" == true ]]; then
            python3 scripts/check_stats.py --site home_page/exposition
          else
            python3 scripts/check_stats.py
          fi

      - name: "Upload website (API documentation, exposition, Stats, leanviz and home page)"
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
