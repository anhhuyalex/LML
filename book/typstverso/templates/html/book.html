<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__ — Book</title>
  <style>
    __TOOLTIPS_CSS__
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeae3; color: #343b36; font: 15px system-ui, sans-serif; }
    .reader { max-width: 1140px; margin: auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; padding: 28px 20px; }
    aside { position: sticky; top: 28px; align-self: start; max-height: calc(100dvh - 56px); overflow: auto; }
    aside h1 { font: 600 21px Georgia, serif; margin: 0 0 8px; }
    #page-count { color: #626a64; }
    nav ol { padding: 0; list-style: none; display: grid; gap: 14px; line-height: 1.45; }
    nav ol ol { margin-top: 8px; padding-left: 14px; gap: 8px; font-size: 14px; }
    nav a { color: inherit; text-decoration: none; }
    nav a:hover { text-decoration: underline; text-underline-offset: 3px; }
    nav a:focus-visible { outline: 2px solid #526a58; outline-offset: 3px; }
    #pages { min-width: 0; display: grid; gap: 28px; }
    .page { position: relative; background: white; box-shadow: 0 4px 24px #302a201a; scroll-margin-top: 24px; }
    .page > svg { display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) { .reader { display: block; padding: 16px; } aside { position: static; margin-bottom: 20px; } }
    @media print { aside, #tooltip, .hover { display: none; } body { background: white; } .reader { display: block; padding: 0; } #pages { gap: 0; } .page { box-shadow: none; break-after: page; } }
  </style>
</head>
<body>
  <div class="reader">
    <aside>
      <h1>Contents</h1>
      <p id="page-count"></p>
      <nav aria-label="Table of contents"><ol id="table-of-contents"></ol></nav>
    </aside>
    <main id="pages" aria-label="Book pages"></main>
  </div>
  <pre id="tooltip" role="tooltip" hidden></pre>
  <script type="application/json" id="document-data">__DOCUMENT_DATA__</script>
  <script>__TOOLTIPS_JS__</script>
  <script>__READER_JS__</script>
</body>
</html>
