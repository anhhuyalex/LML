<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__ — Book</title>
  <!-- LML: resizable, collapsible, whole-book contents pane (files next to the pages). -->
  <link rel="stylesheet" href="book-nav.css">
  <script src="book-nav.js"></script>
  <style>
    __TOOLTIPS_CSS__
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeae3; color: #343b36; font: 15px system-ui, sans-serif; }
    /* LML: three columns (pane, splitter, pages); book-nav.css sets --nav-width and the collapsed state. */
    .reader { max-width: 1140px; margin: auto; display: grid; grid-template-columns: var(--nav-width, 240px) 28px minmax(0, 1fr); padding: 28px 20px; }
    aside { position: sticky; top: 28px; align-self: start; max-height: calc(100dvh - 56px); overflow: auto; }
    aside h1 { font: 600 21px Georgia, serif; margin: 0 0 8px; }
    #page-count { color: #626a64; }
    nav ol { padding: 0; list-style: none; display: grid; gap: 14px; line-height: 1.45; }
    nav ol ol { margin-top: 8px; padding-left: 14px; gap: 8px; font-size: 14px; }
    nav a { color: inherit; text-decoration: none; }
    nav a:hover { text-decoration: underline; text-underline-offset: 3px; }
    nav a:focus-visible { outline: 2px solid #526a58; outline-offset: 3px; }
    #pages { min-width: 0; display: grid; gap: 28px; }
    .page { position: relative; background: white; box-shadow: 0 4px 24px #302a201a; scroll-margin-top: 24px; }
    .page > svg { display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) { .reader { display: block; padding: 16px; } aside { position: static; margin-bottom: 20px; } }
    @media print { aside, #tooltip, .hover, #nav-resizer, #nav-show { display: none; } body { background: white; } .reader { display: block; padding: 0; } #pages { gap: 0; } .page { box-shadow: none; break-after: page; } }
  </style>
</head>
<body>
  <div class="reader">
    <aside id="contents-pane">
      <div class="nav-head">
        <h1>Contents</h1>
        <button id="nav-hide" type="button" aria-controls="contents-pane" aria-expanded="true"
                title="Hide contents (Alt+C)">Hide</button>
      </div>
      <a id="book-home" href="./">&larr; Book home</a>
      <p id="page-count"></p>
      <!-- LML: the whole book, filled by book-nav.js from toc.json. Until then (or if it cannot be
           loaded) the outline of this section only, written by reader.js, stays visible. -->
      <nav id="book-tree" aria-label="Contents of the whole book" hidden></nav>
      <nav id="section-outline" aria-label="Table of contents"><ol id="table-of-contents"></ol></nav>
    </aside>
    <div id="nav-resizer" role="separator" aria-orientation="vertical" aria-controls="contents-pane"
         aria-label="Resize contents" tabindex="0"></div>
    <main id="pages" aria-label="Book pages"></main>
  </div>
  <button id="nav-show" type="button" aria-controls="contents-pane" aria-expanded="false" hidden
          title="Show contents (Alt+C)">&#9776; Contents</button>
  <pre id="tooltip" role="tooltip" hidden></pre>
  <script type="application/json" id="document-data">__DOCUMENT_DATA__</script>
  <script>__TOOLTIPS_JS__</script>
  <script>__READER_JS__</script>
</body>
</html>
